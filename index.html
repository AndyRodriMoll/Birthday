<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday Mom</title>
  <style>
    <body>

  <header>
    <h1>Happy Birthday Mom ❤️</h1>
    <p>Before you scroll... I have a question for you</p>
  </header>

  <section style="margin-top:40px;">
    <h2>Are you ready for your birthday surprise? 🎁</h2>
    <button onclick="showContent()" style="
      padding: 15px 25px;
      font-size: 1.2rem;
      border: none;
      border-radius: 10px;
      background: #e88c8d;
      color: white;
      cursor: pointer;
      margin-top: 20px;
    ">
      Click here ❤️
    </button>
  </section>

  <div id="content" style="display:none;">

    <section class="message">
      <p>
        Hola Mami! Felices 55 años espero que lo disfrutes! Te hice este website para hacerte feliz.
      </p>
      <p>
        I wanted to make this little website to celebrate you and share some special childhood memories. Espero que hayas disfrutado tu dia.
      </p>
      <p>
        Te Quiero!
      </p>
    </section>

    <section class="gallery">
      <img src="photo1.jpeg">
      <img src="photo2.jpeg">
      <img src="photo3.jpeg">
      <img src="photo4.jpeg">
    </section>

    <footer>
      Made for the best mom in the world
    </footer>

  </div>

  <script>
    function showContent() {
      document.getElementById("content").style.display = "block";
      window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    }
  </script>

</body>
